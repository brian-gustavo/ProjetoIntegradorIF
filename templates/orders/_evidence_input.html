<div class="form-group">
    <div class="dropzone">
        <label for="evidence-images" id="evidence-label">Anexar imagens como evidência (opcional, até {{ evidence_max_files }} por envio, limite individual de 10MB)</label>
        <button type="button" onclick="document.getElementById('evidence-images').click()" class="btn btn-outline btn-sm">Escolher imagens</button>
        <input type="file" name="images" id="evidence-images" accept="image/*" multiple hidden>
    </div>
    <div id="evidence-previews" class="image-grid"></div>
    <p id="evidence-error" class="form-error">{{ image_error|default:'' }}</p>
</div>

<script>
    (() => {
        const input = document.getElementById('evidence-images');
        const label = document.getElementById('evidence-label');
        const errorEl = document.getElementById('evidence-error');
        const previews = document.getElementById('evidence-previews');
        const maxFiles = parseInt("{{ evidence_max_files }}");
        const maxSize = 10 * 1024 * 1024;
        const defaultLabel = label.textContent;

        input.addEventListener('change', () => {
            const files = Array.from(input.files);
            previews.innerHTML = '';
            errorEl.textContent = '';
            label.textContent = defaultLabel;

            const grandes = files.filter(f => f.size > maxSize).map(f => f.name);
            if (grandes.length > 0) {
                errorEl.textContent = `As seguintes imagens excedem o limite de 10MB: ${grandes.join(', ')}`;
                input.value = '';
                return;
            }

            if (files.length > maxFiles) {
                errorEl.textContent = `Envie no máximo ${maxFiles} imagens por vez`;
                input.value = '';
                return;
            }

            if (files.length > 0) {
                label.textContent = `${files.length} de ${maxFiles} imagem(ns) selecionada(s)`;
            }

            files.forEach(file => {
                const thumb = document.createElement('div');
                thumb.className = 'image-thumb';
                const img = document.createElement('img');
                img.src = URL.createObjectURL(file);
                img.alt = file.name;
                thumb.appendChild(img);
                previews.appendChild(thumb);
            });
        });
    })();
</script>
