<div data-passo data-alvo="#variant-list" data-titulo="Variações">
    <p>Cada variação representa uma versão do produto (plataforma, edição, capacidade...), com seu próprio nome, preço e quantidade em estoque. O anúncio precisa ter pelo menos uma.</p>
    <p>Clique no ✕ de uma variação para removê-la.</p>
</div>
<div data-passo data-alvo="#variant-list + .btn" data-titulo="Adicionar variação">
    <p>Clique em "+ Adicionar variação" para cadastrar mais uma versão do produto.</p>
</div>
