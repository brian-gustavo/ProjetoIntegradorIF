<h2>{{ category.name }}</h2>

<div style="display: flex; gap: 20px; flex-wrap: wrap;">
    {% for prod in produtos %}
        <div style="border: 1px solid #ccc; padding: 15px; border-radius: 8px; width: 200px;">
            {% if prod.images.all %}
                <img src="{{ prod.images.first.image.url }}" alt="{{ prod.title }}" style="width: 100%; height: 150px; object-fit: cover; border-radius: 4px;">
            {% else %}
                <div style="width: 100%; height: 150px; background: #eee; display: flex; align-items: center; justify-content: center;">Sem foto</div>
            {% endif %}

            <h4><a href="{% url 'product_detail' prod.pk %}">{{ prod.title }}</a></h4>
            <p><strong>R$ {{ prod.price }}</strong></p>
            <p><small>Vendedor: {{ prod.seller.username }}</small></p>
        </div>
    {% empty %}
        <p>Nenhum produto nesta categoria ainda.</p>
    {% endfor %}
</div>

<p><a href="{% url 'home' %}">Voltar</a></p>
