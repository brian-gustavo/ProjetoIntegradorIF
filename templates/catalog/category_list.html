{% extends 'base.html' %}

{% block title %}Categorias — MegaGame{% endblock %}

{% block content %}
<h2 class="section-header">Categorias</h2>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;">
    {% for cat in categorias %}
        <a href="{% url 'category_detail' cat.slug %}" class="btn btn-primary" style="text-align:center;">
            {{ cat.name }}
        </a>
    {% empty %}
        <p style="color:var(--gray-500);">Nenhuma categoria cadastrada ainda</p>
    {% endfor %}
</div>
{% endblock %}
