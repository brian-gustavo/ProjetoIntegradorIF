{% extends 'base.html' %}

{% block title %}Categorias — MegaGame{% endblock %}

{% block content %}
<div class="page-head">
    <div>
        <h1 class="page-title">Categorias</h1>
        <p class="page-sub">Navegue pelos anúncios por tipo de produto</p>
    </div>
</div>
<div class="category-grid">
    {% for cat in categorias %}
        <a href="{% url 'category_detail' cat.slug %}" class="category-card">{{ cat.name }}</a>
    {% empty %}
        <div class="empty-state"><strong>Nenhuma categoria cadastrada ainda</strong></div>
    {% endfor %}
</div>
{% endblock %}
