{% if page.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Paginação">
    {% if page.has_previous %}
        <a href="?{% if qs %}{{ qs }}&{% endif %}page={{ page.previous_page_number }}" class="btn btn-outline btn-sm">← Anterior</a>
    {% endif %}
    <span>Página <strong class="strong">{{ page.number }}</strong> de {{ page.paginator.num_pages }}</span>
    {% if page.has_next %}
        <a href="?{% if qs %}{{ qs }}&{% endif %}page={{ page.next_page_number }}" class="btn btn-outline btn-sm">Próxima →</a>
    {% endif %}
</nav>
{% endif %}
